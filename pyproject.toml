[project]
name = "gahenax-riemann"
version = "3.0.0"
description = "Gahenax Unified Research Platform — Riemann Zero Spectral Analysis & Mersenne Prime Certification"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "mpmath",
    "pandas",
    "matplotlib",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
web = [
    "mlflow",
]
hpc = [
    "mpi4py",
]

[project.scripts]
riemann-avalanche   = "riemann_avalanche:main"
riemann-monitor     = "monitor_avalanche:main"
data-quality        = "scripts.data_quality_monitor:main"

[tool.ruff]
line-length = 92
ignore = ["E402", "E701", "E702", "E722", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff.per-file-ignores]
"scripts/experimental/*" = ["ALL"]
"core/*" = ["E501"]
